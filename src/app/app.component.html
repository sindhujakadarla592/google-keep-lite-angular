<div class="app">
  <header>
    <h1>Google Keep Lite</h1>
  </header>

  <div class="search">
    <input [(ngModel)]="search" placeholder="Search notes or todos..." />
  </div>

  <div class="container">
    <section class="panel notes-panel">
      <h2>Notes</h2>
      <div class="add">
        <input [(ngModel)]="newNoteTitle" placeholder="Note title" />
        <textarea [(ngModel)]="newNoteContent" placeholder="Note content"></textarea>
        <button (click)="addNote()">Add Note</button>
      </div>

      <div class="grid">
        <div class="note-card" *ngFor="let n of filteredNotes; let i = index" [ngClass]="noteColorClass(i)">
          <h3>{{ n.title }}</h3>
          <p>{{ n.content }}</p>
        </div>
        <div *ngIf="filteredNotes.length === 0" class="empty">No notes found</div>
      </div>
    </section>

    <section class="panel todos-panel">
      <h2>To-Do Lists</h2>
      <div class="add">
        <input [(ngModel)]="newTodoTitle" placeholder="Todo title" />
        <div class="task-buffer">
          <input [(ngModel)]="newTodoTaskText" placeholder="Task text" />
          <button (click)="addTaskToBuffer()">Add task</button>
        </div>

        <div *ngIf="newTodoTasks.length" class="buffered">
          <small>Tasks to add:</small>
          <ul>
            <li *ngFor="let t of newTodoTasks; let idx = index">
              {{ t.text }} <button (click)="removeBufferedTask(idx)">x</button>
            </li>
          </ul>
        </div>
        <button (click)="addTodo()">Add Todo</button>
      </div>

      <div class="grid">
        <div class="todo-card" *ngFor="let td of filteredTodos">
          <h3>{{ td.title }}</h3>
          <ul class="tasks">
            <li *ngFor="let tk of td.tasks">
              <label>
                <input type="checkbox" [checked]="tk.done" (change)="toggleTask(td, tk)" />
                <span [class.done]="tk.done">{{ tk.text }}</span>
              </label>
            </li>
          </ul>
          <div *ngIf="td.tasks.length === 0" class="empty">No tasks yet</div>
        </div>
        <div *ngIf="filteredTodos.length === 0" class="empty">No todos found</div>
      </div>
    </section>
  </div>
</div>
